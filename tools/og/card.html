<!doctype html>
<!--
  Social preview card (1200×630): the hero's mid-century shapes over a title.
  Rendered to PNG by render.sh; not deployed.
  Params: ?title=…&kicker=…
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=block">
  <style>
    :root {
      --bg: #0b0b0d; --fg: #fdfdf9; --fg-2: rgba(253,253,249,.74); --fg-3: rgba(253,253,249,.5);
      --terracotta: #d4503c; --mustard: #e2a834; --sage: #8f9d73; --teal: #4fb3a9;
    }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--fg); }
    body { position: relative; font-family: Archivo, sans-serif; -webkit-font-smoothing: antialiased; }
    svg { position: absolute; inset: 0; }
    .text { position: absolute; left: 60px; right: 60px; bottom: 50px; }
    .title {
      font-weight: 820; font-variation-settings: "wdth" var(--wdth, 100);
      text-transform: uppercase; line-height: .8; letter-spacing: -.035em; margin-left: -.04em;
    }
    .title span { display: block; width: max-content; white-space: nowrap; }
    .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 30px; }
    .kicker { font-size: 34px; font-weight: 500; color: var(--fg-2); }
    .site { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--fg-3); }
  </style>
</head>
<body>
  <svg id="shapes" viewBox="0 0 1200 630" aria-hidden="true"></svg>
  <div class="text">
    <h1 class="title" id="title"></h1>
    <div class="meta"><span class="kicker" id="kicker"></span><span class="site">moen.ai</span></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const W = 1200, MAX_W = W - 120;
    const titleEl = document.getElementById('title');
    document.getElementById('kicker').textContent = params.get('kicker') || 'Professional Maker';

    // Same curve and shapes as the hero (js/main.js), frozen at t = 0.
    const smoothPath = (pts) => {
      const n = pts.length;
      let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ` +
          `${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ` +
          `${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      return `${d}Z`;
    };
    const C = { t: 'var(--terracotta)', m: 'var(--mustard)', s: 'var(--sage)', g: 'var(--teal)', k: 'var(--fg)' };
    const SHAPES = [
      { kind: 'sun', fx: 0.02, fy: 0.5, r: 0.4, color: C.t },
      { kind: 'kidney', fx: 0.24, fy: 0.5, r: 0.24, color: C.s, rot: 12 },
      { kind: 'half', fx: 0.5, fy: -0.1, r: 0.46, color: C.m, rot: 180 },
      { kind: 'pebble', fx: 0.63, fy: 0.64, r: 0.15, color: C.g },
      { kind: 'burst', fx: 0.74, fy: 0.3, r: 0.2, color: C.s },
      { kind: 'pebble', fx: 0.86, fy: 0.6, r: 0.24, color: C.t },
      { kind: 'ring', fx: 0.985, fy: 0.12, r: 0.28, color: C.k },
    ];
    const WAVES = [[2, 0.055], [3, 0.035], [4, 0.015]];

    function shapeSVG(spec, R, seed) {
      switch (spec.kind) {
        case 'sun': return `<circle r="${R}" fill="${spec.color}"/>`;
        case 'half': return `<path d="M${-R},0A${R},${R} 0 0 1 ${R},0Z" fill="${spec.color}"/>`;
        case 'ring': return `<circle r="${R * 0.97}" fill="none" stroke="${spec.color}" stroke-width="2"/>`;
        case 'burst': {
          let d = '';
          for (let i = 0; i < 16; i++) {
            const a = (i / 16) * Math.PI * 2, r0 = R * 0.28, r1 = i % 2 ? R * 0.72 : R;
            d += `M${(Math.cos(a) * r0).toFixed(1)},${(Math.sin(a) * r0).toFixed(1)}L${(Math.cos(a) * r1).toFixed(1)},${(Math.sin(a) * r1).toFixed(1)}`;
          }
          return `<path d="${d}" fill="none" stroke="${spec.color}" stroke-width="${Math.max(2, R * 0.05)}" stroke-linecap="round"/>` +
            `<circle r="${R * 0.14}" fill="${spec.color}"/>`;
        }
        default: { // pebble, kidney
          const stretch = spec.kind === 'kidney' ? 1.45 : 1;
          const pts = [];
          for (let i = 0; i < 32; i++) {
            const a = (i / 32) * Math.PI * 2;
            let r = 1;
            WAVES.forEach(([k, amp], j) => { r += amp * Math.sin(k * a + seed * (j + 1)); });
            if (spec.kind === 'kidney') r -= 0.12 * Math.max(0, Math.cos(a - Math.PI / 2)) ** 3;
            pts.push([Math.cos(a) * R * r * stretch, Math.sin(a) * R * r]);
          }
          return `<path d="${smoothPath(pts)}" fill="${spec.color}"/>`;
        }
      }
    }

    // Fit the title to the card width: one line when it can be big enough,
    // otherwise two balanced lines.
    function setTitle(lines, size) {
      titleEl.replaceChildren(...lines.map((l) => Object.assign(document.createElement('span'), { textContent: l })));
      titleEl.style.fontSize = `${size}px`;
    }
    const widest = () => Math.max(...[...titleEl.children].map((s) => s.getBoundingClientRect().width));
    function fit(lines, maxSize) {
      setTitle(lines, 100);
      return Math.min(maxSize, (100 * MAX_W) / widest());
    }
    function layoutTitle(text) {
      const one = fit([text], 210);
      const words = text.split(' ');
      if (one >= 150 || words.length < 2) return setTitle([text], one);
      let best = null;
      for (let i = 1; i < words.length; i++) {
        const lines = [words.slice(0, i).join(' '), words.slice(i).join(' ')];
        const size = fit(lines, 170);
        if (!best || size > best.size) best = { lines, size };
      }
      setTitle(best.lines, best.size);
    }

    document.fonts.load('820 100px Archivo').then(() => document.fonts.ready).then(() => {
      layoutTitle(params.get('title') || 'Trey Moen');
      // The shapes fill the band above the title, as on the home page.
      const H = titleEl.getBoundingClientRect().top - 28;
      document.getElementById('shapes').innerHTML = SHAPES.map((spec, n) => {
        const seed = n * 1.93 + 0.4, R = spec.r * H;
        const x = spec.fx * W, y = Math.min(spec.fy * H, H - R * 1.12);
        const angle = spec.kind === 'burst' ? seed * 40 : (spec.rot || 0) + (spec.kind === 'half' ? 0 : Math.sin(seed) * 4);
        return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${angle.toFixed(2)})">${shapeSVG(spec, R, seed)}</g>`;
      }).join('');
      document.title = 'ready';
    });
  </script>
</body>
</html>
