<!doctype html>
<!--
  Social preview card (1200×630): the hero's mid-century shapes, full bleed,
  no text (link previews already show the title and domain).
  Rendered to PNG by render.sh; not deployed.
  Params: ?hue=0–3 (reassign the palette) &mirror=1 (flip left to right)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #0b0b0d; --fg: #fdfdf9; --terracotta: #d4503c; --mustard: #e2a834; --sage: #8f9d73; --teal: #4fb3a9; }
    * { margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    svg { display: block; }
  </style>
</head>
<body>
  <svg id="shapes" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true"></svg>

  <script>
    const params = new URLSearchParams(location.search);
    const hue = Number(params.get('hue')) || 0;
    const mirror = params.get('mirror') === '1';

    // Same curve and shapes as the hero (js/main.js), frozen at t = 0.
    const smoothPath = (pts) => {
      const n = pts.length;
      let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
        d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ` +
          `${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ` +
          `${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
      }
      return `${d}Z`;
    };

    // The Claude spark and the Codex cloud (with its cursor), as 24×24
    // artwork centred on 12,12.
    const LOGO = {
      claude: 'M' + '4.709,15.955 9.429,13.308 9.509,13.078 9.429,12.95 9.2,12.95 8.41,12.902 5.712,12.829 3.373,12.732 1.107,12.61 .536,12.489 0,11.784 .055,11.432 .535,11.111 1.221,11.171 2.741,11.274 5.019,11.432 6.671,11.529 9.12,11.784 9.509,11.784 9.564,11.627 9.43,11.529 9.327,11.432 6.969,9.836 4.417,8.148 3.081,7.176 2.357,6.685 1.993,6.223 1.835,5.215 2.491,4.493 3.372,4.553 3.597,4.614 4.49,5.3 6.398,6.776 8.889,8.609 9.254,8.913 9.399,8.81 9.418,8.737 9.254,8.463 7.899,6.017 6.453,3.527 5.809,2.495 5.639,1.876 5.535,1.147 6.283,.134 6.696,0 7.692,.134 8.112,.498 8.732,1.912 9.734,4.141 11.289,7.171 11.745,8.069 11.988,8.901 12.079,9.156 12.237,9.156 12.237,9.01 12.365,7.304 12.602,5.209 12.832,2.514 12.912,1.754 13.288,.844 14.035,.352 14.619,.632 15.099,1.317 15.032,1.761 14.746,3.612 14.187,6.515 13.823,8.457 14.035,8.457 14.278,8.215 15.263,6.909 16.915,4.845 17.645,4.025 18.495,3.121 19.042,2.69 20.075,2.69 20.835,3.819 20.495,4.985 19.431,6.332 18.55,7.474 17.286,9.174 16.496,10.534 16.569,10.644 16.757,10.624 19.613,10.018 21.156,9.738 22.997,9.423 23.83,9.811 23.921,10.206 23.593,11.013 21.624,11.499 19.315,11.961 15.876,12.774 15.834,12.804 15.883,12.865 17.432,13.011 18.094,13.047 19.716,13.047 22.736,13.272 23.526,13.794 24,14.432 23.921,14.917 22.706,15.537 21.066,15.148 17.237,14.238 15.925,13.909 15.743,13.909 15.743,14.019 16.836,15.087 18.842,16.897 21.351,19.227 21.478,19.805 21.156,20.26 20.816,20.211 18.611,18.554 17.76,17.807 15.834,16.187 15.706,16.187 15.706,16.357 16.15,17.006 18.495,20.527 18.617,21.607 18.447,21.96 17.839,22.173 17.171,22.051 15.797,20.126 14.382,17.959 13.239,16.016 13.099,16.096 12.425,23.35 12.109,23.72 11.38,24 10.773,23.539 10.451,22.792 10.773,21.316 11.162,19.392 11.477,17.862 11.763,15.962 11.933,15.33 11.921,15.288 11.781,15.306 10.347,17.273 8.167,20.218 6.441,22.063 6.027,22.227 5.31,21.857 5.377,21.195 5.778,20.606 8.166,17.57 9.606,15.688 10.536,14.602 10.53,14.444 10.475,14.444 4.132,18.56 3.002,18.706 2.515,18.25 2.576,17.504 2.807,17.261 4.715,15.949 4.709,15.955'.split(' ').join('L') + 'Z',
      codex: 'M8.086.457a6.105 6.105 0 013.046-.415c1.333.153 2.521.72 3.564 1.7a.117.117 0 00.107.029c1.408-.346 2.762-.224 4.061.366l.063.03.154.076c1.357.703 2.33 1.77 2.918 3.198.278.679.418 1.388.421 2.126a5.655 5.655 0 01-.18 1.631.167.167 0 00.04.155 5.982 5.982 0 011.578 2.891c.385 1.901-.01 3.615-1.183 5.14l-.182.22a6.063 6.063 0 01-2.934 1.851.162.162 0 00-.108.102c-.255.736-.511 1.364-.987 1.992-1.199 1.582-2.962 2.462-4.948 2.451-1.583-.008-2.986-.587-4.21-1.736a.145.145 0 00-.14-.032c-.518.167-1.04.191-1.604.185a5.924 5.924 0 01-2.595-.622 6.058 6.058 0 01-2.146-1.781c-.203-.269-.404-.522-.551-.821a7.74 7.74 0 01-.495-1.283 6.11 6.11 0 01-.017-3.064.166.166 0 00.008-.074.115.115 0 00-.037-.064 5.958 5.958 0 01-1.38-2.202 5.196 5.196 0 01-.333-1.589 6.915 6.915 0 01.188-2.132c.45-1.484 1.309-2.648 2.577-3.493.282-.188.55-.334.802-.438.286-.12.573-.22.861-.304a.129.129 0 00.087-.087A6.016 6.016 0 015.635 2.31C6.315 1.464 7.132.846 8.086.457zm-.804 7.85a.848.848 0 00-1.473.842l1.694 2.965-1.688 2.848a.849.849 0 001.46.864l1.94-3.272a.849.849 0 00.007-.854l-1.94-3.393z' +
        'M12.728 14.547a.849.849 0 000 1.695h4.848a.849.849 0 000-1.696h-4.848z',
    };

    // Fills rotate through the palette by `hue`; the marks keep their own
    // colours (terracotta spark, white cloud and ring).
    const FILLS = ['var(--terracotta)', 'var(--mustard)', 'var(--sage)', 'var(--teal)'];
    const fill = (i) => FILLS[(i + hue) % FILLS.length];
    // x, y, r in card pixels; `c` indexes FILLS. Edge shapes run off the card.
    const SHAPES = [
      { kind: 'sun', x: 60, y: 560, r: 250, c: 0 },
      { kind: 'kidney', x: 470, y: 440, r: 100, c: 2, rot: 12 },
      { kind: 'pebble', x: 600, y: 140, r: 135, c: 1 },
      { kind: 'pebble', x: 205, y: 120, r: 58, c: 3 },
      { kind: 'codex', x: 300, y: 300, r: 56 },
      { kind: 'pebble', x: 830, y: 360, r: 66, c: 3 },
      { kind: 'claude', x: 945, y: 175, r: 96 },
      { kind: 'pebble', x: 1070, y: 500, r: 125, c: 0 },
      { kind: 'ring', x: 1165, y: 20, r: 150 },
    ];
    const GROUND = 90;
    const WAVES = [[2, 0.055], [3, 0.035], [4, 0.015]];

    function shapeSVG(spec, color, seed) {
      const R = spec.r;
      switch (spec.kind) {
        case 'sun': return `<circle r="${R}" fill="${color}"/>`;
        case 'ring': return `<circle r="${R * 0.97}" fill="none" stroke="var(--fg)" stroke-width="3"/>`;
        case 'claude':
        case 'codex':
          return `<path d="${LOGO[spec.kind]}" transform="scale(${(R / 12).toFixed(3)}) translate(-12 -12)" ` +
            `fill="${spec.kind === 'claude' ? 'var(--terracotta)' : 'var(--fg)'}" fill-rule="${spec.kind === 'codex' ? 'evenodd' : 'nonzero'}"/>`;
        default: { // pebble, kidney
          const stretch = spec.kind === 'kidney' ? 1.45 : 1;
          const pts = [];
          for (let i = 0; i < 32; i++) {
            const a = (i / 32) * Math.PI * 2;
            let r = 1;
            WAVES.forEach(([k, amp], j) => { r += amp * Math.sin(k * a + seed * (j + 1)); });
            if (spec.kind === 'kidney') r -= 0.12 * Math.max(0, Math.cos(a - Math.PI / 2)) ** 3;
            pts.push([Math.cos(a) * R * r * stretch, Math.sin(a) * R * r]);
          }
          return `<path d="${smoothPath(pts)}" fill="${color}"/>`;
        }
      }
    }

    const shapes = SHAPES.map((spec, n) => {
      const seed = n * 1.93 + 0.4 + hue;
      const angle = (spec.rot || 0) + Math.sin(seed) * 4;
      // Mirrored cards flip the marks back, so they still read the right way round.
      const flip = mirror && (spec.kind === 'claude' || spec.kind === 'codex') ? ' scale(-1 1)' : '';
      return `<g transform="translate(${spec.x} ${spec.y}) rotate(${angle.toFixed(2)})${flip}">${shapeSVG(spec, fill(spec.c ?? 0), seed)}</g>`;
    }).join('');
    // A bright ground along the bottom, which the sun and the big pebble set
    // behind. iMessage tints its caption bar from the image, so this is what
    // makes the bar under the preview pop rather than come out near-black.
    const ground = `<rect y="${630 - GROUND}" width="1200" height="${GROUND}" fill="${fill(1)}"/>`;
    const art = (mirror ? `<g transform="translate(1200 0) scale(-1 1)">${shapes}</g>` : shapes) + ground;
    document.getElementById('shapes').innerHTML = art;
    document.title = 'ready';
  </script>
</body>
</html>
